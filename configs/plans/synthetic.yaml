# Local smoke test of the whole pipeline on a tiny synthetic stream (CPU, minutes).
data: data/synthetic.yaml
runs:
  - {name: tidegr,       method: methods/tidegr.yaml,       seeds: [0], tune: true}
  - {name: lightgcn_ft,  method: methods/lightgcn_ft.yaml,  seeds: [0]}
  - {name: xsimgcl_ft,   method: methods/xsimgcl_ft.yaml,   seeds: [0]}
  - {name: pda,          method: methods/pda.yaml,          seeds: [0]}
  - {name: ewc,          method: methods/ewc.yaml,          seeds: [0]}
  - {name: kd_lite,      method: methods/kd_lite.yaml,      seeds: [0]}
  - {name: sasrec,       method: methods/sasrec.yaml,       seeds: [0], overrides: {method.epochs.warmup_max: 5, method.epochs.stream: 2}}
  - {name: sqn,          method: methods/sqn.yaml,          seeds: [0], overrides: {method.epochs.warmup_max: 5, method.epochs.stream: 2}}
  - {name: lightgcn_retrain, method: methods/lightgcn_retrain.yaml, seeds: [0]}
  - {name: ensemble,     method: methods/ensemble.yaml,     seeds: [0], overrides: {method.members: 2}}
  - {name: abl_no_belief, method: methods/tidegr.yaml, seeds: [0], tuned_from: tidegr,
     overrides: {method.anchor: none, method.drift.enabled: false, method.rl.enabled: false, method.edge_samples: 0, method.thompson: false, method.calib_use_var: false}}
  - {name: abl_raw_cusum, method: methods/tidegr.yaml, seeds: [0], tuned_from: tidegr, overrides: {method.drift.mode: raw}}
  - {name: abl_rl_random, method: methods/tidegr.yaml, seeds: [0], tuned_from: tidegr, overrides: {method.rl.random: true}}
