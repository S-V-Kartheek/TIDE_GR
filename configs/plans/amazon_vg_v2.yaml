# TIDE-GR v2 experiment plan for Amazon Reviews 2023 Video_Games 5-core (branch v2; SEPARATE runs folder).
# Dataset check (2026-11-24): 811k ratings, 94.6k users, 25.6k items; 13 history blocks (<2015 + 2015-2017 quarters),
# 21 stream quarters (2018Q1-2023Q1); ~80% of stream ratings come from returning users, ~12% hit new items.
# SQN is skipped: every review has the same reward, so the Q-head carries no extra signal.
# Resumable exactly like the v1 plan. The run named "tidegr" is TIDE-GR v2 (so report/plots/sheet treat it as
# the reference); "tidegr_v1" is the unchanged v1 model, re-run here for a same-folder comparison.
data: data/amazon_vg.yaml
runs:
  # ---- stage 1: TIDE-GR v2 + main baselines, seed 0 (all tuning on history days only) ----
  - {name: tidegr,           method: methods/tidegr_v2.yaml,        seeds: [0], tune: true}
  - {name: sasrec,           method: methods/sasrec.yaml,           seeds: [0], tune: true}
  - {name: lightgcn_ft,      method: methods/lightgcn_ft.yaml,      seeds: [0], tune: true}
  - {name: xsimgcl_ft,       method: methods/xsimgcl_ft.yaml,       seeds: [0], tune: true}
  - {name: tidegr_v1,        method: methods/tidegr.yaml,           seeds: [0], tune: true}
  # ---- stage 2: more seeds for the main comparison ----
  - {name: tidegr,           method: methods/tidegr_v2.yaml,        seeds: [1, 2], tune: true}
  - {name: sasrec,           method: methods/sasrec.yaml,           seeds: [1, 2], tune: true}
  - {name: lightgcn_ft,      method: methods/lightgcn_ft.yaml,      seeds: [1, 2], tune: true}
  - {name: xsimgcl_ft,       method: methods/xsimgcl_ft.yaml,       seeds: [1, 2], tune: true}
  # ---- stage 3: ablations of v2 (seed 0, tuned v2 parameters) - the RL controller first ----
  - {name: abl_rl_fixed_default, method: methods/tidegr_v2.yaml, seeds: [0], tuned_from: tidegr, overrides: {method.rl.fixed_arm: 0}}
  - {name: abl_rl_fixed_stable,  method: methods/tidegr_v2.yaml, seeds: [0], tuned_from: tidegr, overrides: {method.rl.fixed_arm: 1}}
  - {name: abl_rl_fixed_plastic, method: methods/tidegr_v2.yaml, seeds: [0], tuned_from: tidegr, overrides: {method.rl.fixed_arm: 2}}
  - {name: abl_rl_fixed_free,    method: methods/tidegr_v2.yaml, seeds: [0], tuned_from: tidegr, overrides: {method.rl.fixed_arm: 3}}
  - {name: abl_rl_random,        method: methods/tidegr_v2.yaml, seeds: [0], tuned_from: tidegr, overrides: {method.rl.random: true}}
  - {name: abl_rl_bandit_feedback, method: methods/tidegr_v2.yaml, seeds: [0], tuned_from: tidegr, overrides: {method.rl.feedback: chosen}}
  - {name: abl_rl_nodrift_ctx,   method: methods/tidegr_v2.yaml, seeds: [0], tuned_from: tidegr, overrides: {method.rl.no_drift_context: true}}
  - {name: abl_rl_ndcg_only,     method: methods/tidegr_v2.yaml, seeds: [0], tuned_from: tidegr, overrides: {method.rl.w_f: 0.0}}
  - {name: abl_v1_replay,        method: methods/tidegr_v2.yaml, seeds: [0], tuned_from: tidegr, overrides: {method.memory.sampling: pooled}}
  - {name: abl_no_belief,        method: methods/tidegr_v2.yaml, seeds: [0], tuned_from: tidegr,
     overrides: {method.anchor: none, method.drift.enabled: false, method.edge_samples: 0, method.thompson: false, method.calib_use_var: false}}
  - {name: abl_raw_cusum,        method: methods/tidegr_v2.yaml, seeds: [0], tuned_from: tidegr, overrides: {method.drift.mode: raw}}
  - {name: abl_no_boosters,      method: methods/tidegr_v2.yaml, seeds: [0], tuned_from: tidegr,
     overrides: {method.loss: bpr, method.contrast.lambda_cl: 0.0, method.recent.gamma: 0.0}}
  # ---- stage 4: remaining baselines (same as v1; EWC / KD-lite with wider anchor grids) ----
  - {name: pda,              method: methods/pda.yaml,              seeds: [0], tune: true}
  - {name: ewc,              method: methods/ewc.yaml,              seeds: [0], tune: true}
  - {name: kd_lite,          method: methods/kd_lite.yaml,          seeds: [0], tune: true}
  - {name: lightgcn_retrain, method: methods/lightgcn_retrain.yaml, seeds: [0], tuned_from: lightgcn_ft}
  # ---- stage 5 (if time remains): ablation seeds for the RL claims ----
  - {name: abl_rl_fixed_default, method: methods/tidegr_v2.yaml, seeds: [1, 2], tuned_from: tidegr, overrides: {method.rl.fixed_arm: 0}}
  - {name: abl_rl_random,        method: methods/tidegr_v2.yaml, seeds: [1, 2], tuned_from: tidegr, overrides: {method.rl.random: true}}
